<style id="site-css">
/* Layout concept: the hexagon is a color wheel and the front door. Each color opens its own page of cards. */
:root{
  --paper:#FCFCFA; --ink:#1D2430; --soft:#5D6A73; --faint:#8E9BA2; --rule:#E4E8EA; --edge:#C3CDD2; --white:#FFFFFF; --danger:#B4232A; --blend:multiply;
  --c0:#FFC46B; --c1:#4A63C2; --c2:#6FD3A6; --c3:#B89BF2; --c4:#7EC4F0; --c5:#F47C7C;
  --k0:#1D2430; --k1:#FFFFFF; --k2:#1D2430; --k3:#1D2430; --k4:#1D2430; --k5:#1D2430;
  --wine:#7B2D3E; --mt:#5A3EC0; --mtb:#EFEAFC; --mtl:#7B62CF;
  --t0:#F0A83A; --t1:#4A63C2; --t2:#3FBF87; --t3:#9B7BE6; --t4:#4FA9E3; --t5:#EC5F5F;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12181D; --ink:#E9EEF0; --soft:#A7B4BC; --faint:#76868F; --rule:#28333A; --edge:#4D5E67; --t1:#8297EA; --wine:#D99AA6; --mt:#C9B9FF; --mtb:#2B2546; --mtl:#B7A6F2; --danger:#FF8A8A; --blend:screen; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#12181D; --ink:#E9EEF0; --soft:#A7B4BC; --faint:#76868F; --rule:#28333A; --edge:#4D5E67; --t1:#8297EA; --wine:#D99AA6; --mt:#C9B9FF; --mtb:#2B2546; --mtl:#B7A6F2; --danger:#FF8A8A; --blend:screen; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 72px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 32px;padding-block:34px 18px}
h1{font-family:var(--serif);font-weight:300;font-size:2.7rem;line-height:1.05;margin:0;letter-spacing:-.01em}
h1 a{text-decoration:none}
.role{margin:6px 0 0;color:var(--soft)}
.intro{display:grid;grid-template-columns:290px minmax(0,1fr);gap:44px;align-items:start;margin:12px 0 34px}
.intro.nophoto{grid-template-columns:minmax(0,1fr)}
.pfig{margin:0}
.pfig img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--rule)}
.about{min-width:0;max-width:40em}
.about h2{font-family:var(--serif);font-weight:300;font-size:2.15rem;line-height:1.2;margin:4px 0 18px;color:var(--wine);text-wrap:balance}
.about p{margin:0 0 14px;font-size:16px;line-height:1.6}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr);gap:20px}.pfig{width:min(220px,70%);justify-self:center}.about h2{font-size:1.65rem}}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.nav a{padding:5px 12px;border-radius:99px;text-decoration:none;color:var(--soft);font-size:14px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.editbtn{padding:4px 12px;border-radius:99px;border:1px solid var(--edge);font-size:14px;margin-left:6px}
.editbtn:hover{border-color:var(--ink)}
.contact{color:var(--soft);font-size:14px}
.copy{font-size:12px;margin-left:8px;border-bottom:1px solid currentColor;line-height:1.2}

.view[hidden]{display:none!important}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border:1px solid var(--edge);border-radius:99px;font-size:14px;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

#stage{position:relative;height:660px;margin-top:6px;transition:height .38s cubic-bezier(.3,.7,.3,1);touch-action:manipulation;overflow:hidden;--tw:150px;--th:130px;--cw:186px;--ch:161px}
#stage.m{--tw:104px;--th:90px;--cw:118px;--ch:102px}
#lat,#wires{position:absolute;inset:0;width:100%;height:100%;display:block}
#lat{-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent);mask-image:radial-gradient(closest-side,#000 55%,transparent)}
#lat circle{fill:var(--edge);opacity:.5}
.kite{fill-opacity:.3;transition:fill-opacity .25s}
.kite.hot{fill-opacity:.5}
.ring,.chord{fill:none;transition:stroke-width .2s}
.ring{stroke-width:3.5}
.chord{stroke-width:1.8;stroke-dasharray:1 6;stroke-linecap:round}
.ring.hot{stroke-width:5.5}
.chord.hot{stroke-width:2.6;stroke-dasharray:none}
.branch,.xl{fill:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .55s ease-out}
.branch{stroke-width:2;stroke-opacity:.75}
.branch.in,.xl.in{stroke-dashoffset:0}
.branch.lit{stroke-width:2.8;stroke-opacity:1}
.xl{stroke-width:2.2}

.tile,.dot,.n{position:absolute;left:0;top:0;will-change:transform}
.tile{width:var(--tw);height:var(--th);display:grid;place-items:center;text-align:center;color:var(--vk);transition:width .35s,height .35s}
.tile svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tile polygon{fill:var(--vc);stroke:var(--paper);stroke-width:2.5;vector-effect:non-scaling-stroke;transition:fill .25s,filter .2s}
.tile:hover polygon{filter:brightness(1.06) saturate(1.1)}
.tile:focus-visible{outline:none}
.tile:focus-visible polygon{stroke:var(--ink);stroke-width:3}
.tile .full,.tile .ab{position:relative;display:block;padding-inline:11px;line-height:1.2}
.tile .ab{display:none;font-size:11.5px;font-weight:600;padding-inline:2px}
.tile b{display:block;font-weight:600;font-size:15px;white-space:pre-line}
.tile i{display:block;font-style:normal;font-size:12px;opacity:.8;margin-top:4px;white-space:pre-line}
#stage.m .tile b{font-size:12.5px}
#stage.m .tile i{font-size:10px;margin-top:2px}
#stage.m .tile .full{padding-inline:9px}
#stage.m .tile .ab{font-size:9px}
.tile.compact{width:calc(var(--tw)*.58);height:calc(var(--th)*.58)}
#stage.m .tile.compact{width:calc(var(--tw)*.68);height:calc(var(--th)*.68)}
.tile.compact .full{display:none}
.tile.compact .ab{display:block}
.tile.linked polygon{stroke:var(--ink);stroke-width:3}
.tile.dim{color:var(--soft)}
.tile.dim polygon{fill:color-mix(in srgb,var(--vc) 22%,var(--paper))}
.tile.center{width:var(--cw);height:var(--ch);z-index:1;color:var(--paper)}
.tile.center polygon{fill:var(--ink)}
.tile.center .full{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.25;padding-inline:30px}
.tile.center .full b{display:inline;font-size:inherit;font-weight:600;white-space:normal}
#stage.m .tile.center .full{font-size:11.5px;padding-inline:20px}
.tile.center.compact{width:calc(var(--cw)*.48);height:calc(var(--ch)*.48)}
.dot{width:30px;height:30px;display:grid;place-items:center;transition:opacity .2s;z-index:1}
.dot::after{content:"";width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--da),var(--db));box-shadow:0 0 0 2.5px var(--paper),0 0 0 3.5px color-mix(in srgb,var(--ink) 18%,transparent);transition:transform .2s}
.dot:hover::after,.dot.hot::after{transform:scale(1.3)}
.dot:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:50%}
#stage.open .dot:not(.hot){opacity:0;pointer-events:none}
.ring,.chord{transition:stroke-width .25s,opacity .3s}
#stage.open .ring:not(.hot),#stage.open .chord:not(.hot){opacity:.38}
#stage .chord.aux:not(.hot),#stage.open .chord.aux:not(.hot){opacity:0}
.dot.aux{display:none}
#stage.open .ring.hot,#stage.open .chord.hot{stroke-width:6.5;stroke-dasharray:16 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-23}}
.tile.sel{z-index:2}
.tile.sel polygon{stroke:var(--ink);stroke-width:3.5}
.tile.far polygon{fill:color-mix(in srgb,var(--vc) 40%,var(--paper))}
.tile.far{color:var(--soft)}
#explore{margin-top:4px}
.xp{display:grid;gap:14px;padding:16px 18px;border-radius:8px;background:color-mix(in srgb,var(--vc) 15%,var(--paper))}
.xhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}
.xhead>div{min-width:0}
.xhead h3{font-family:var(--serif);font-weight:400;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
.xhead .meta{font-size:14px;color:var(--soft);margin:2px 0 0}
.xconn{display:flex;flex-wrap:wrap;gap:6px}
.xc{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:99px;background:var(--paper);font-size:13px}
.xc::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--da) 45%,var(--db) 55%)}
.xc b{font-weight:600}
.xc:hover{box-shadow:0 0 0 1px var(--ink)}
.xtabs{display:flex;flex-wrap:wrap;gap:6px}
.xt{padding:6px 13px;border-radius:99px;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--vc) 30%,var(--paper))}
.xt[aria-pressed="true"]{background:var(--vc);color:var(--vk)}
.xitems{display:flex;flex-wrap:wrap;gap:6px}
.xi{padding:6px 11px;border-radius:5px;font-size:14px;line-height:1.3;background:var(--paper);border:1px solid color-mix(in srgb,var(--vc) 50%,var(--edge))}
button.xi:hover{border-color:var(--ink)}
.xi[aria-pressed="true"]{background:var(--vc);color:var(--vk);border-color:var(--vc)}
.xi.dim{opacity:.35}
span.xi{color:var(--soft)}
#tip{position:absolute;left:0;top:0;z-index:3;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.3;padding:5px 10px;border-radius:4px;pointer-events:none;max-width:210px;width:max-content;opacity:0;transition:opacity .15s}
#tip.show{opacity:1}

.n{font-size:14px;text-align:left;line-height:1.3;opacity:0;transition:opacity .28s,background .2s,color .2s;display:flex;justify-content:space-between;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--vc) 24%,var(--paper));border-radius:5px}
.n.in{opacity:1}
.n.d1{font-weight:500;padding:9px 12px}
.n.d2{padding:6px 9px;background:var(--paper)}
.n:hover{background:color-mix(in srgb,var(--vc) 36%,var(--paper))}
.n.on{background:var(--vc);color:var(--vk)}
.n .chev{font-style:normal;opacity:.6;transition:transform .2s;flex:none}
.n.on .chev{transform:rotate(90deg);opacity:1}
.n.dim{opacity:.32}

#panel{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 32px;padding:14px 18px;margin-top:4px;background:color-mix(in srgb,var(--vc,var(--ink)) 20%,var(--paper));border-radius:6px}
#panel h3{font-family:var(--serif);font-weight:400;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
#panel .meta{font-size:14px;color:var(--soft);margin:2px 0 0}
#panel .body{margin:4px 0 0;font-size:15px}
#panel>div{min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.go{font-size:13px;font-weight:500;padding:5px 12px;border-radius:99px;background:var(--gc);color:var(--gk);text-decoration:none;flex:none}
.go.open{background:var(--ink);color:var(--paper)}

.grp{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px 24px;padding-block:30px 0}
.grp+.grp{border-top:1px solid var(--rule);margin-top:26px;padding-top:28px}
.grp h2{font-family:var(--serif);font-weight:400;font-size:1.15rem;line-height:1.3;margin:0;color:var(--soft)}
.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;max-width:46em}
.li{display:grid;grid-template-columns:15px minmax(0,1fr);gap:10px;width:100%;padding:6px 8px;margin-inline:-8px;border-radius:5px;transition:background .15s}
button.li:hover{background:color-mix(in srgb,var(--vc) 22%,var(--paper))}
.hx{width:15px;height:13px;margin-top:.22em;background:var(--vc);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:block}
.li b{font-weight:500}
.li .s{display:block;font-size:13.5px;color:var(--soft)}
.li.wy{grid-template-columns:15px minmax(0,1fr) auto}
.lirow{display:flex;align-items:flex-start;min-width:0}
.lirow .li{flex:0 1 auto;min-width:0}
.lnks{display:flex;flex-wrap:wrap;gap:2px 16px;margin:0 0 0 25px;padding-block:0 4px}
.lnk{font-size:13px;font-weight:500;color:var(--soft);text-decoration:none}
.lnk:hover{color:var(--ink);text-decoration:underline}
.lmeta{margin:-6px 0 2px 25px;font-size:13.5px;line-height:1.45;color:var(--soft)}
.lmeta .ilk{font-style:normal;font-weight:500;margin-left:2px;color:var(--soft);text-decoration:none}
.lmeta .ilk:hover{color:var(--ink);text-decoration:underline}
.abt{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:8px;padding:0;vertical-align:-3px;border:1px solid var(--edge);border-radius:50%;background:none;color:var(--soft);font:inherit;font-size:12px;line-height:1;cursor:pointer}
.abt::after{content:"+"}
.abt[aria-expanded="true"]::after{content:"\2212"}
.abt:hover{color:var(--ink);border-color:var(--ink)}
.abt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lirow>.abt{margin-top:9px}
.absp{margin:4px 0 8px 25px;max-width:44em;font-size:14px;line-height:1.55;color:var(--ink)}
.li .y{font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:.1em}
#home-lists{padding-top:26px}
.htabs{display:flex;flex-wrap:wrap;gap:6px 4px;padding-block:26px 0;border-bottom:1px solid var(--rule)}
.htab{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 9px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:14px;color:var(--soft);cursor:pointer}
.htab .hx{width:10px;height:11px}
.htab:hover{color:var(--ink)}
.htab[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.htab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hdetail{display:grid;gap:4px;padding-top:8px}
.hagenda{padding-top:6px}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-top:18px}
.deck{border:1px solid var(--rule);border-radius:12px;overflow:hidden;min-width:0}
.dtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.dtop h4{margin:0;font-size:15px;font-weight:600}
.dn{font-size:13px;color:var(--soft)}
.dscroll{max-height:min(70vh,520px);overflow-y:auto;display:grid;gap:12px;padding:12px;background:color-mix(in srgb,var(--ink) 6%,var(--paper));overscroll-behavior:contain}
.dscroll img{display:block;width:100%;height:auto;aspect-ratio:auto 16/9;border-radius:4px;background:#fff;box-shadow:0 1px 4px color-mix(in srgb,var(--ink) 18%,transparent)}
.dscroll:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.hdetail .agrp h3{margin-top:22px}
.hintro{margin:4px 0 0;font-size:16px;max-width:40em}
.hintro a{font-weight:500}
.hback{margin-top:30px}
.lit{display:grid;min-width:0}
.abs{margin:0 0 6px 25px;max-width:44em;min-width:0}
.abs summary{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--edge);border-radius:50%;font-size:14px;line-height:1;color:var(--soft);list-style:none;cursor:pointer}
.abs summary::-webkit-details-marker{display:none}
.abs summary::after{content:"+";font-weight:400}
.abs[open] summary{margin-bottom:0}
.abs[open] summary::after{content:"\2212"}
.abs summary:hover{color:var(--ink);border-color:var(--ink)}
.abs summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.abs p{margin:4px 0 8px;font-size:14px;line-height:1.55;color:var(--ink)}
.card .abs{margin:4px 0 0}

/* Area pages */
.ahead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px 32px;align-items:center;padding-block:16px 8px}
.bighex{width:150px;height:130px;position:relative;display:grid;place-items:center;color:var(--vk);text-align:center;font-weight:600;font-size:17px;line-height:1.2;white-space:pre-line}
.bighex svg{position:absolute;inset:0;width:100%;height:100%}
.bighex polygon{fill:var(--vc)}
.bighex span{position:relative;padding-inline:16px}
.ahead h2{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.15;margin:0;text-wrap:balance}
.ahead .meta{margin:6px 0 0;color:var(--soft)}
.ahead .intro{margin:10px 0 0;font-size:16px;max-width:40em}
.ahead .intro a{font-weight:500}
.abrand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin:14px 0 2px}
.alogo{display:block;height:46px;width:auto;max-width:100%;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:6px 12px}
.alogo-d{background:#0b0914;border:0;padding:0}
.alogoa{display:block;border-radius:10px;transition:transform .15s,box-shadow .15s}
.alogoa:hover{transform:translateY(-1px);box-shadow:0 4px 14px color-mix(in srgb,var(--ink) 18%,transparent)}
.alogoa:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.alinks{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.alinks a{font-weight:500}
.switch{display:flex;flex-wrap:wrap;gap:6px;padding-block:18px 4px}
.sw{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:99px;font-size:13.5px;text-decoration:none;background:color-mix(in srgb,var(--vc) 22%,var(--paper))}
.sw .hx{margin:0}
.sw[aria-current="page"]{background:var(--vc);color:var(--vk);font-weight:500}
.agrp h3{font-family:var(--serif);font-weight:400;font-size:1.25rem;margin:34px 0 14px;color:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--vc) 10%,var(--paper));display:flex;flex-direction:column;scroll-margin-top:20px;transition:box-shadow .3s}
.card .art{aspect-ratio:16/7;max-width:100%;display:block;background:color-mix(in srgb,var(--vc) 26%,var(--paper))}
.card .art svg{display:block;width:100%;height:100%}
.card .art img{display:block;width:100%;height:100%;object-fit:cover}
.card .cb{padding:14px 16px 16px;display:grid;gap:4px;min-width:0}
.card h4{margin:0;font-size:16px;font-weight:600;line-height:1.3;text-wrap:balance}
.card .w,.card .s{margin:0;font-size:13.5px;color:var(--soft)}

var COLORS=['Apricot','Blue','Mint','Lavender','Sky','Coral'];
function icon(k){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[k]||ICONS.dot)[1]+'</svg>'}
function iconSelect(path,label,cur,none){var id=fid(path);return '<label class="ef" for="'+id+'"><span>'+esc(label)+'</span><select class="ed" id="'+id+'" data-b="'+path+'">'+(none?'<option value="">Pattern only</option>':'')+Object.keys(ICONS).map(function(k){return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+ICONS[k][0]+'</option>'}).join('')+'</select></label>'}
function colorSelect(path,label,cur){var id=fid(path);return '<label class="ef" for="'+id+'"><span>'+esc(label)+'</span><select class="ed" id="'+id+'" data-num="'+path+'">'+COLORS.map(function(n,i){return '<option value="'+i+'"'+(i===cur?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'}
function cardSelect(path,label,cur){var id=fid(path);return '<label class="ef" for="'+id+'"><span>'+esc(label)+'</span><select class="ed" id="'+id+'" data-b="'+path+'">'+D.areas.map(function(a){return '<optgroup label="'+esc(a.name||a.ab)+'">'+a.groups.map(function(g){return (g.cards||[]).map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===cur?' selected':'')+'>'+esc(c.l||c.t)+'</option>'}).join('')}).join('')+'</optgroup>'}).join('')+'</select></label>'}
function agItem(it){
  var c=it.card?CARD[it.card]:null;if(it.card&&!c)return '';
  var t=c?c.t:it.t,meta=c?wsHTML(c,' · '):esc(it.s||''),q=c?c.q:'';
  var attr=c?' data-card="'+esc(c.id)+'"':(it.go?' data-go="'+esc(it.go)+'"':'');
  return '<li><button type="button" class="ai"'+attr+'><span class="ib">'+icon(it.icon)+'</span><span class="at"><b>'+esc(t)+'</b>'+(meta?'<span class="am">'+meta+'</span>':'')+(q?'<span class="aq">'+esc(q)+'</span>':'')+'</span></button>'+(c&&c.url?'<a class="lnk" href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.ul||hostOf(c.url))+' ↗</a>':'')+'</li>';
}
function vennLabel(x,i,cx,cy){
  var parts=String(x.t||'').split('→'),l1=parts[0].trim(),l2=parts.length>1?'→ '+parts.slice(1).join('→').trim():'';
  return '<g class="vl" data-ax="'+i+'" tabindex="0" role="button" aria-label="'+esc(x.h||x.t)+'"><svg x="'+(cx-11)+'" y="'+(cy-40)+'" width="22" height="22" viewBox="0 0 24 24" class="ic">'+(ICONS[x.icon]||ICONS.dot)[1]+'</svg><text x="'+cx+'" y="'+(cy)+'">'+esc(l1)+'</text>'+(l2?'<text x="'+cx+'" y="'+(cy+18)+'">'+esc(l2)+'</text>':'')+'</g>';
}
function agendaViewHTML(pre){

}
function renderAgenda(){
  var AG=D.agenda||{axes:[]},box=Q('#v-agenda'),h='';
  if(!editing){
    h=agendaViewHTML('');
  }else{
    h='<div class="epanel"><h2 class="eh">Research page</h2>'+inp('agenda.lead','Opening sentence',{area:1,rows:3})+inp('agenda.center','Word in the middle of the circles')+'</div>';
    AG.axes.forEach(function(x,i){var p='agenda.axes.'+i;
      h+='<div class="aedit" style="'+cv(x.c)+'"><div class="two">'+inp(p+'.t','Label inside the circle (→ starts a second line)')+inp(p+'.h','Heading')+'</div>'+inp(p+'.q','Question',{area:1})+'<div class="two">'+colorSelect(p+'.c','Color',x.c)+iconSelect(p+'.icon','Symbol',x.icon)+'</div>'+
        (x.items||[]).map(function(it,j){var ip=p+'.items.'+j;return '<div class="erowcard">'+(it.card!==undefined?cardSelect(ip+'.card','Project',it.card):'<div class="two">'+inp(ip+'.t','Title')+inp(ip+'.s','Details')+'</div>'+areaSelect(ip+'.go','Links to',it.go||'',true))+iconSelect(ip+'.icon','Symbol',it.icon)+'<div class="erow">'+moveDel(ip)+'</div></div>'}).join('')+
        eb('additem',p+'.items','+ Add project').replace('class="eb"','class="eadd"')+'</div>';

function setAx(i){document.querySelectorAll('#v-agenda [data-ax],#home-lists [data-ax]').forEach(function(el){var on=i!==null&&+el.dataset.ax===i;el.classList.toggle('on',on);el.classList.toggle('off',i!==null&&!on)})}
document.addEventListener('mouseover',function(e){if((curView!=='agenda'&&curView!=='home')||editing)return;var g=e.target.closest&&e.target.closest('#v-agenda [data-ax],#home-lists [data-ax]');setAx(g?+g.dataset.ax:null)});
document.addEventListener('focusin',function(e){if((curView!=='agenda'&&curView!=='home')||editing)return;var g=e.target.closest&&e.target.closest('#v-agenda .vl,#home-lists .vl');setAx(g?+g.dataset.ax:null)});

/* ---------- Router ---------- */
function route(){
  var k=(location.hash||'').replace('#','')||'home';
  var isArea=KEY.hasOwnProperty(k),view=isArea?'area':(k==='misc'?'misc':(k==='agenda'?'agenda':'home'));
  curView=view;curArea=isArea?KEY[k]:null;
  Q('#v-home').hidden=view!=='home';Q('#v-area').hidden=view!=='area';Q('#v-misc').hidden=view!=='misc';Q('#v-agenda').hidden=view!=='agenda';
  document.querySelectorAll('[data-nav]').forEach(function(a){if(a.dataset.nav===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  homeVisible=view==='home';
  renderViews();
  if(homeVisible)plan();
  var target=pendingCard&&isArea&&!editing?document.getElementById('card-'+pendingCard):null;pendingCard=null;
  if(target){target.classList.add('focus');target.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});setTimeout(function(){target.classList.remove('focus')},2400)}
  else if(view!=='home'||k==='home')window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var ch=e.target.closest('.chip[data-lens]');if(ch){setLens(ch.dataset.lens);return}
  var vx=e.target.closest('.vc,.vl');if(vx){var vroot=vx.closest('#home-lists,#v-agenda')||document,ax=vroot.querySelector('.axis[data-ax="'+vx.getAttribute('data-ax')+'"]');if(ax)ax.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});return}
  var abt=e.target.closest('.abt');if(abt){var ap=abt.closest('.lit');ap=ap&&ap.querySelector('.absp');var op=abt.getAttribute('aria-expanded')!=='true';abt.setAttribute('aria-expanded',op?'true':'false');if(ap)ap.hidden=!op;return}
  var ht=e.target.closest('[data-htab]');if(ht){var hvs=ht.dataset.htab;if(hvs==='sel'||hvs==='-1'){homeTab=hvs==='sel'?'sel':'home';if(sel.v!==null)closeAll();else renderHomeLists()}else{var hv=+hvs;if(sel.v!==hv)openV(hv)}return}
  if(e.target.closest('[data-overview]')){closeAll();var st=Q('#stage');if(st.scrollIntoView)st.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});return}
  var xt=e.target.closest('.xt');if(xt){sel.c=+xt.dataset.g;sel.l=null;clearX();render(null);renderExplore();var gEl=Q('#home-lists .agrp[data-g="'+xt.dataset.g+'"]');if(gEl&&gEl.scrollIntoView)gEl.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});return}
  var xi=e.target.closest('button.xi[data-cid]');if(xi){var xc0=CARD[xi.dataset.cid];if(!xc0)return;sel.l=xc0.id;renderExplore();markX(xc0);
    var cEl=Q('#home-lists').querySelector('#card-'+(window.CSS&&CSS.escape?CSS.escape(xc0.id):xc0.id));
    if(cEl){render(null);cEl.classList.add('focus');cEl.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});setTimeout(function(){cEl.classList.remove('focus')},2400)}
    else{render(cPanel(xc0,sel.v),sel.v);if(mobile&&panel.scrollIntoView)panel.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}
    return}
  var xc=e.target.closest('.xc');if(xc){openV(+xc.dataset.v);return}
  var act=e.target.closest('[data-act]');
  if(act){e.preventDefault();doAction(act.dataset.act,act.dataset.p);return}
  var b=e.target.closest('button[data-card],button[data-go]');if(!b)return;
  if(b.dataset.card){var id=b.dataset.card;pendingCard=id;location.hash=D.areas[AREAOF[id]].key}
  else location.hash=b.dataset.go;
});
function newId(){return 'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function doAction(act,p){
  if(act==='delimg'){var cc=get(p);if(cc){delete cc.img;changed();renderViews()}return}
  if(act==='delphoto'){delete D.photo;changed();renderViews();return}
  var parts,idx,arr,j,tmp;
  if(act==='up'||act==='down'){parts=p.split('.');idx=+parts.pop();arr=get(parts.join('.'));j=idx+(act==='up'?-1:1);if(!arr||j<0||j>=arr.length)return;tmp=arr[idx];arr[idx]=arr[j];arr[j]=tmp}
  else if(act==='del'){parts=p.split('.');idx=+parts.pop();arr=get(parts.join('.'));if(arr)arr.splice(idx,1)}
  else if(act==='addcard'){var g=get(p);(g.cards=g.cards||[]).push({id:newId(),t:'New item'})}
  else if(act==='addgroup'){get(p).push({h:'New section',cards:[]})}
  else if(act==='addhome'){D.home.push({h:'New section',ids:[]})}
  else if(act==='addrow'){get(p).push({t:'New entry'})}
  else if(act==='addmisc'){D.misc.push({c:0,t:'New card'})}
  else if(act==='additem'){var ids=Object.keys(CARD);get(p).push({card:ids[0],icon:'dot'})}
  else return;
  index();prune();changed();renderViews();
}
document.addEventListener('input',function(e){
  var t=e.target;if(!editing)return;
  if(t.dataset.b){set(t.dataset.b,t.value);changed()}
  else if(t.dataset.bc){set(t.dataset.bc,t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean));changed()}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!editing)return;
  if(t.dataset.upload&&t.files&&t.files[0]){upload(t.dataset.upload,t.files[0]);t.value='';return}
  if(t.hasAttribute('data-upload-photo')&&t.files&&t.files[0]){uploadPhoto(t.files[0]);t.value='';return}
  if(t.dataset.cardPhoto&&t.files&&t.files[0]){uploadCardPhoto(t.dataset.cardPhoto,t.files[0]);t.value='';return}
  if(t.dataset.tg){var c=get(t.dataset.tg);if(!c)return;var s=(c.tg||'').split(t.dataset.k).join('');if(t.checked)s+=t.dataset.k;set(t.dataset.tg+'.tg',s);changed()}
  else if(t.dataset.home!==undefined){var id=t.dataset.home;D.home.forEach(function(h){h.ids=h.ids.filter(function(x){return x!==id})});if(t.value!==''&&D.home[+t.value])D.home[+t.value].ids.push(id);changed()}
  else if(t.dataset.num){set(t.dataset.num,t.value===''?null:+t.value);changed();if(curView==='misc')renderMisc();if(curView==='agenda')renderAgenda()}
  else if(t.dataset.b&&t.tagName==='SELECT'){if(curView==='home')renderHomeLists();if(curView==='agenda')renderAgenda()}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.vl')){e.preventDefault();e.target.closest('.vl').dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
  if(e.key!=='Escape'||!homeVisible)return;
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(sel.l){sel.l=null;clearX();render(null);renderExplore()}
  else if(sel.v!==null){closeAll()}
});

/* ---------- Uploads (photos and videos) ---------- */
async function upload(gp,file){
  if(!ASSETS){estat.textContent='Uploading needs editor access.';return}
  var g=get(gp);if(!g)return;
  var type=file.type||(/\.mov$/i.test(file.name)?'video/quicktime':/\.mp4$/i.test(file.name)?'video/mp4':'');
  estat.textContent='Uploading '+file.name+'…';
  try{
    var r=await ASSETS.upload(file,type?{contentType:type}:undefined);
    (g.media=g.media||[]).push({k:/^video\//.test(r.contentType||type)?'video':'img',src:'/_blob/'+r.id});
    changed();renderViews();estat.textContent='Uploaded. Press Save to publish it.';
  }catch(err){
    var c=err&&err.code;
    estat.textContent=c==='too_large'?'That file is over 20 MB. Compress it and try again.':(c==='not_granted'||c==='not_writer')?'Uploading needs editor access.':'Could not upload that file.';
  }
}

async function uploadCardPhoto(path,file){
  if(!ASSETS){estat.textContent='Uploading needs editor access.';return}
  estat.textContent='Uploading '+file.name+'…';
  try{var r=await ASSETS.upload(file,file.type?{contentType:file.type}:undefined);var c=get(path);if(c){c.img='/_blob/'+r.id;changed();renderViews();estat.textContent='Card photo updated. Press Save to publish it.'}}
  catch(err){estat.textContent=(err&&err.code)==='too_large'?'That file is over 20 MB.':'Could not upload that photo.'}
}
async function uploadPhoto(file){
  if(!ASSETS){estat.textContent='Uploading needs editor access.';return}
  estat.textContent='Uploading '+file.name+'…';
  try{var r=await ASSETS.upload(file,file.type?{contentType:file.type}:undefined);D.photo='/_blob/'+r.id;changed();renderViews();estat.textContent='Photo updated. Press Save to publish it.'}
  catch(err){estat.textContent=(err&&err.code)==='too_large'?'That file is over 20 MB.':'Could not upload that photo.'}
}

/* ---------- Edit and save ---------- */
var estat=Q('#estat'),esave=Q('#esave');
function changed(){dirty=true;estat.textContent='Unsaved changes. Press Save to publish them.'}
function enterEdit(){if(!ART)return;editing=true;dirty=false;document.body.classList.add('is-editing');Q('#ebar').hidden=false;esave.disabled=false;estat.textContent='Editing. Nothing is saved until you press Save.';renderViews()}
function cancelEdit(){
  D=JSON.parse(ORIG);index();prune();computeLens();editing=false;dirty=false;
  document.body.classList.remove('is-editing');Q('#ebar').hidden=true;
  buildMap();route();
}
function buildDoc(){
  var json=JSON.stringify(D,null,1).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(D.name||'Homepage')+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS+'\n<style id="site-css">'+CSS+'</style>\n\n'+WRAP+'\n\n<script type="application/json" id="site-data">'+json+'<\/script>\n\n<script>'+SRC+'<\/script></body></html>';
}
async function save(){
  if(!ART)return;
  esave.disabled=true;estat.textContent='Saving…';
  try{
    await ART.publish(buildDoc());
    estat.textContent='Saved. The page is reloading with your changes.';
  }catch(err){
    var code=err&&err.code;
    if(code==='conflict')estat.textContent='A newer version was saved somewhere else. The page is reloading to it, so this edit was not kept.';
    else if(code==='not_writer'||code==='not_granted'||code==='consent_required'||code==='capability_disabled'||code==='not_declared'||code==='capability_removed'){estat.textContent='This view is read-only. Open the page as its owner or an editor to save.';return}
    else if(code==='rate_limited'){estat.textContent='Saving too often. Wait a minute, then press Save again.';esave.disabled=false}
    else if(code==='too_large'){estat.textContent='The page is too large to save. Remove some content and try again.';esave.disabled=false}
    else{estat.textContent='Could not save. Press Save to try again.';esave.disabled=false}
  }
}
Q('#editbtn').addEventListener('click',enterEdit);
Q('#ecancel').addEventListener('click',cancelEdit);
esave.addEventListener('click',save);
window.addEventListener('beforeunload',function(e){if(editing&&dirty){e.preventDefault();e.returnValue=''}});

function initEdit(tries){
  if(!(window.claude&&typeof window.claude.use==='function')){if(tries<20)setTimeout(function(){initEdit(tries+1)},500);return}
  window.claude.use('artifact').then(function(art){
    if(!art)return null;
    return window.claude.use('user').then(function(u){return u&&u.canEdit?u.canEdit():null}).catch(function(){return null}).then(function(can){
      if(can===false)return;ART=art;renderHeader();
      window.claude.use('assets').then(function(a){ASSETS=a||null;if(editing)renderViews()}).catch(function(){});
    });
  }).catch(function(){});
}

/* ---------- Start ---------- */
buildMap();route();
if(RM){draw(0)}else{draw(performance.now());last=performance.now();requestAnimationFrame(tick)}
if(window.ResizeObserver){var rw=0;new ResizeObserver(function(){var w=stage.clientWidth;if(w&&w!==rw){var firstShow=!rw;rw=w;if(firstShow)first=true;plan()}}).observe(stage)}
else window.addEventListener('resize',plan);
initEdit(0);

var copy=Q('#copy');
copy.addEventListener('click',function(){
  var txt=Q('#mail').textContent,done=function(){copy.textContent='Copied';setTimeout(function(){copy.textContent='Copy'},1500)};
  function pick(){var r=document.createRange();r.selectNodeContents(Q('#mail'));var s=getSelection();s.removeAllRanges();s.addRange(r)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(pick);else pick();
});
})();
